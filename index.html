<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1.0001, maximum-scale=1.0001, user-scalable=no">
  <title>使用 jQuery 打造互動性網頁動畫效果</title>
  <link rel="stylesheet" href="https://public.codepenassets.com/css/reset-2.0.min.css">
  <link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Anton'>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/4.4.6/css/swiper.min.css">
  <link rel="stylesheet" href="css/all.css">
  <script src="js/jquery-4.0.0.min.js"></script>
  <script src="js/all.js"></script>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css'>
  <style>
    .swiper-container {
      width: 800px;
      height: 400px;
    }
  </style>

</head>

<body>
  <div class="header">
      <ul class="menu">
        <li><a href="#">首頁</a></li>
        <li>
          <a href="#" class="dropdown">產品介紹</a>
          <ul class="dropdown-open">
            <li><a href="#">Html 5基礎教</a></li>
            <li><a href="#">響應式網站設計</a></li>
            <li><a href="#">jQuery 實戰教學</a></li>
          </ul>
        </li>
      </ul>
      <li>聯絡我們</li>
  </div>
  <!-- Slider main container -->
  <div class="swiper-container">
    <!-- Additional required wrapper -->
    <div class="swiper-wrapper">
      <!-- Slides -->
      <div class="swiper-slide">六角學院讓您奠定良好的前端基礎</div>
      <div class="swiper-slide">Slide 2</div>
      <div class="swiper-slide">Slide 3</div>
    </div>
    <!-- If we need pagination -->
    <div class="swiper-pagination"></div>

    <!-- If we need navigation buttons -->
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>


  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/4.4.6/js/swiper.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/4.4.6/js/swiper.min.js"></script>
  <script>
    var mySwiper = new Swiper('.swiper-container', {
      // Optional parameters
      direction: 'horizontal',
      speed: 3000,
      loop: true,
      autoplay: {
        delay: 1500,
      },
      effect: 'cube',
      // If we need pagination
      pagination: {
        el: '.swiper-pagination',
      },

      // Navigation arrows
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },


    })
  </script>
</body>

</html>
